name: CD


## ===========================================================
## CD 실행 조건
## CI Workflow가 main Branch에서 성공한 경우 실행
## ===========================================================

on:
  workflow_run:
    workflows:
      - CI

    types:
      - completed

    branches:
      - main


## ===========================================================
## GitHub Actions 권한
## ===========================================================

permissions:

  ## GitHub Repository Checkout 권한
  contents: read

  ## GitHub OIDC Token 발급 권한
  id-token: write


## ===========================================================
## CD Job
## ===========================================================

jobs:

  deploy:

    ## CI Workflow가 성공한 경우에만 CD 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:


      ## -------------------------------------------------------
      ## 1. GitHub Repository Checkout
      ## CI에서 검증한 Commit을 동일하게 Checkout
      ## -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      ## -------------------------------------------------------
      ## 2. Python 설치
      ## -------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7

        with:
          python-version: '3.13'


      ## -------------------------------------------------------
      ## 3. AWS SAM CLI 설치
      ## -------------------------------------------------------

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}


      ## -------------------------------------------------------
      ## 4. GitHub Context 확인
      ## OIDC 인증 문제 확인을 위한 디버깅
      ## -------------------------------------------------------

      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"


      ## -------------------------------------------------------
      ## 5. GitHub OIDC → AWS IAM Role 인증
      ## -------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sports-crawling-github-actions


      ## -------------------------------------------------------
      ## 6. AWS 인증 확인
      ## -------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      ## -------------------------------------------------------
      ## 7. SAM Template 검증
      ## -------------------------------------------------------

      - name: Validate SAM template
        run: |
          sam validate


      ## -------------------------------------------------------
      ## 8. SAM Build
      ## Selenium/Chrome이 포함된 Dockerfile을 빌드하므로
      ## --use-container 옵션 필요
      ## -------------------------------------------------------

      - name: Build SAM application
        run: |
          sam build --use-container


      ## -------------------------------------------------------
      ## 9. AWS SAM Deploy
      ## ECR 이미지 Push + CloudFormation Stack 업데이트
      ## -------------------------------------------------------

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name sports-crawling-pipeline \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DbInstanceClass="${{ vars.DB_INSTANCE_CLASS }}" \
              DbName="${{ vars.DB_NAME }}" \
              ScheduleEnabled="${{ vars.SCHEDULE_ENABLED }}" \
              ScheduleExpression="${{ vars.SCHEDULE_EXPRESSION }}"
