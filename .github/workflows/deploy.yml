name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 3. AWS SAM CLI
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. GitHub Actions 정보 확인
      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"

      # 5. OIDC 정보 확인
      - name: Debug OIDC Claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null)

          echo "$PAYLOAD" | python -c "
          import sys, json
          data = json.load(sys.stdin)
          print('OIDC sub:', data.get('sub'))
          print('OIDC aud:', data.get('aud'))
          print('OIDC repository:', data.get('repository'))
          print('OIDC event_name:', data.get('event_name'))
          print('OIDC ref:', data.get('ref'))
          print('OIDC workflow:', data.get('workflow'))
          "

      # 6. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sports-crawling-github-actions

      # 7. AWS 인증 확인
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 8. SAM Template 검증
      - name: Validate SAM template
        run: |
          sam validate

      # 9. SAM Build
      - name: Build SAM application
        run: |
          sam build --use-container

      # 10. SAM Deploy
      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name sports-crawling-pipeline \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DbInstanceClass="${{ vars.DB_INSTANCE_CLASS }}" \
              DbName="${{ vars.DB_NAME }}" \
              ScheduleEnabled="${{ vars.SCHEDULE_ENABLED }}" \
              ScheduleExpression="${{ vars.SCHEDULE_EXPRESSION }}"